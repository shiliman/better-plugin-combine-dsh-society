<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="办公厅">
  <!-- 米白卡片 = 各部门的目录卡 -->
  <rect x="13" y="15" width="10" height="23" rx="2" fill="#dcd8cb"/>
  <rect x="27" y="12" width="10" height="26" rx="2" fill="#f4f1e8"/>
  <rect x="41" y="17" width="10" height="21" rx="2" fill="#cfcaba"/>
  <!-- 抽屉柜 = 索引本身 -->
  <rect x="12" y="39" width="40" height="14" rx="2" fill="none" stroke="#f4f1e8" stroke-width="2"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="#f4f1e8" stroke-width="1.4"/>
  <!-- 红色把手 = 落点 -->
  <rect x="29" y="42" width="6" height="2.6" rx="1.3" fill="#c8553d"/>
  <rect x="29" y="49" width="6" height="2.6" rx="1.3" fill="#c8553d"/>
</svg>
